<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tide Breath</title>
<meta name="description" content="A quiet breath pacer. Box, 4·7·8, coherent, or your own pattern. Nothing leaves this page.">
<meta name="theme-color" content="#F5F2EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1C33" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tide Breath">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&family=Public+Sans:wght@400;500&display=swap">
<style>
:root{
  --paper:#F5F2EC;
  --paper-2:#EBE7DF;
  --ink:#2B2F38;
  --ink-2:#565B67;
  --blue:#2F5FA3;
  --blue-soft:rgba(47,95,163,.14);
  --blue-line:rgba(47,95,163,.45);
  --grain:rgba(43,47,56,.045);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1C33; --paper-2:#16264A; --ink:#EEEAE2; --ink-2:#BAC1D2;
    --blue:#9DB8E6; --blue-soft:rgba(157,184,230,.16); --blue-line:rgba(157,184,230,.4); --grain:rgba(255,255,255,.035);
  }
}
:root[data-theme="dark"]{
  --paper:#0F1C33; --paper-2:#16264A; --ink:#EEEAE2; --ink-2:#BAC1D2;
  --blue:#9DB8E6; --blue-soft:rgba(157,184,230,.16); --blue-line:rgba(157,184,230,.4); --grain:rgba(255,255,255,.035);
}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Public Sans",system-ui,-apple-system,sans-serif; font-size:15px; line-height:1.5;
  background-image:
    radial-gradient(circle at 20% 15%, var(--grain) 0 1px, transparent 1.5px),
    radial-gradient(circle at 70% 60%, var(--grain) 0 1px, transparent 1.5px);
  background-size:9px 9px, 13px 13px;
}
.app{min-height:100%; display:grid; grid-template-rows:auto 1fr auto; padding-inline:max(20px, env(safe-area-inset-left)) max(20px, env(safe-area-inset-right)); padding-block:max(22px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-bottom)); max-width:720px; margin-inline:auto; box-sizing:border-box}
header{display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap}
.brand{font-family:Jost,"Public Sans",sans-serif; font-weight:300; letter-spacing:.42em; text-transform:uppercase; color:var(--blue); font-size:15px}
.brand small{display:block; letter-spacing:.18em; font-size:11px; color:var(--ink-2); margin-top:2px}
.pattern-code{font-family:Jost,sans-serif; font-weight:300; font-size:22px; letter-spacing:.06em; color:var(--ink); font-variant-numeric:tabular-nums; white-space:nowrap}
.pattern-code span{color:var(--ink-2); font-size:14px; letter-spacing:.1em; margin-left:.2em}

main{display:grid; place-items:center; gap:22px; padding-block:14px}
.stage{position:relative; width:min(62vw,300px); aspect-ratio:1; max-width:100%; display:grid; place-items:center}
.ring{position:absolute; inset:0; border-radius:50%; border:1px solid var(--blue-line)}
.tide{width:100%; height:100%; border-radius:50%; background:var(--blue-soft); transform:scale(.55); transition:transform .3s linear}
.stage.anim .tide{transition-timing-function:cubic-bezier(.45,0,.55,1)}
.phase{position:absolute; inset:0; display:grid; place-items:center; text-align:center; pointer-events:none}
.phase .word{font-family:Jost,sans-serif; font-weight:300; letter-spacing:.35em; text-transform:uppercase; font-size:16px; color:var(--blue); padding-left:.35em}
.phase .count{font-family:Jost,sans-serif; font-weight:300; font-size:44px; line-height:1; color:var(--ink); font-variant-numeric:tabular-nums; margin-top:6px}
.timeline{width:min(62vw,300px); max-width:100%; height:3px; display:flex; gap:3px}
.timeline i{flex:var(--w) 0 0; background:var(--blue-line); opacity:.6; border-radius:2px; transition:opacity .3s}
.timeline i.on{opacity:1; background:var(--blue)}

.controls{display:grid; gap:14px; width:100%; max-width:440px}
.presets{display:flex; gap:8px; flex-wrap:wrap; justify-content:center}
button,.chip{font:inherit; cursor:pointer}
.chip{border:1px solid var(--blue-line); background:transparent; color:var(--ink); border-radius:999px; padding:8px 16px; font-size:15px; letter-spacing:.02em}
.chip[aria-pressed="true"]{background:var(--blue); color:var(--paper); border-color:var(--blue)}
.chip:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue); outline-offset:2px}
.durations{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.durations label{display:grid; gap:4px; text-align:center; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-2)}
.durations input{width:100%; box-sizing:border-box; font:inherit; font-family:Jost,sans-serif; font-weight:300; font-size:22px; text-align:center; padding:6px 0; border:0; border-bottom:1px solid var(--blue-line); background:transparent; color:var(--ink); font-variant-numeric:tabular-nums}
.durations input::-webkit-outer-spin-button,.durations input::-webkit-inner-spin-button{-webkit-appearance:none}
.durations input{-moz-appearance:textfield}
.row{display:flex; gap:12px; align-items:center; justify-content:center; flex-wrap:wrap}
.go{font-family:Jost,sans-serif; font-weight:400; letter-spacing:.3em; text-transform:uppercase; padding:14px 36px 14px 40px; border-radius:999px; border:1px solid var(--blue); background:var(--blue); color:var(--paper); font-size:15px}
.go[data-running="true"]{background:transparent; color:var(--blue)}
/* sound settings mirror the durations: small-caps label over a value on a hairline */
.sound{display:grid; grid-template-columns:1.3fr .8fr 1.3fr; gap:14px 10px; margin-top:4px}
.sound label{display:grid; gap:4px; text-align:center; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-2)}
.sound select{-webkit-appearance:none; appearance:none; width:100%; font:inherit; font-size:16px; letter-spacing:0; text-transform:none; text-align:center; text-align-last:center;
  color:var(--ink); border:0; border-bottom:1px solid var(--blue-line); border-radius:0; padding:6px 16px 6px 4px;
  background-color:transparent; background-repeat:no-repeat; background-size:5px 5px;
  background-image:linear-gradient(45deg, transparent 50%, var(--ink-2) 50%), linear-gradient(135deg, var(--ink-2) 50%, transparent 50%);
  background-position:calc(100% - 9px) 55%, calc(100% - 4px) 55%}
.sound .swell{grid-column:1 / -1; display:flex; align-items:center; justify-content:center; gap:14px}
.sound input[type=range]{accent-color:var(--blue); width:min(220px, 60%); margin:0}
.sound [hidden]{display:none}

footer{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; font-size:13px; color:var(--ink-2); border-top:1px solid var(--blue-line); padding-top:10px; margin-top:8px}
footer b{font-weight:500; color:var(--ink); font-variant-numeric:tabular-nums}
footer code{font-family:ui-monospace,Menlo,monospace; font-size:12px; color:var(--blue)}
@media (prefers-reduced-motion: reduce){
  .tide{transition:none !important}
}
@media (max-width:420px){
  body{font-size:16px}
  .pattern-code{font-size:20px}
  footer{flex-direction:column; gap:4px}
  .presets{gap:6px}
  .chip{font-size:14px; padding:7px 12px}
}
</style>

<div class="app">
  <header>
    <div class="brand">Tide Breath<small>Harmonic Systems</small></div>
    <div class="pattern-code" id="code" aria-live="polite">4 · 4 · 4 · 4 <span>sec</span></div>
  </header>

  <main>
    <div class="stage" id="stage" role="img" aria-label="Breathing circle">
      <div class="ring"></div>
      <div class="tide" id="tide"></div>
      <div class="phase">
        <div>
          <div class="word" id="word">Ready</div>
          <div class="count" id="count">·</div>
        </div>
      </div>
    </div>
    <div class="timeline" id="timeline" aria-hidden="true"></div>

    <div class="controls">
      <div class="presets" id="presets" role="group" aria-label="Patterns">
        <button class="chip" data-p="4-4-4-4">Box</button>
        <button class="chip" data-p="4-7-8-0">4·7·8</button>
        <button class="chip" data-p="5.5-0-5.5-0">Coherent</button>
        <button class="chip" data-p="4-0-8-0">Long exhale</button>
      </div>
      <div class="durations">
        <label>In <input id="d0" type="number" min="0" max="30" step="0.5" value="4"></label>
        <label>Hold <input id="d1" type="number" min="0" max="30" step="0.5" value="4"></label>
        <label>Out <input id="d2" type="number" min="0" max="30" step="0.5" value="4"></label>
        <label>Hold <input id="d3" type="number" min="0" max="30" step="0.5" value="4"></label>
      </div>
      <div class="row">
        <button class="go" id="go" data-running="false">Begin</button>
      </div>
      <div class="sound">
        <label>Sound
          <select id="sound">
            <option value="wash">Wash</option><option value="hum">Hum on exhale</option><option value="off">Silent</option>
          </select>
        </label>
        <label>Key
          <select id="key" aria-label="Key">
            <option value="C">C</option><option value="B">B</option><option value="Bb">B♭</option><option value="A">A</option>
            <option value="Ab">A♭</option><option value="G">G</option><option value="Gb">G♭</option><option value="F">F</option>
            <option value="E">E</option><option value="Eb">E♭</option><option value="D">D</option><option value="Db">D♭</option>
          </select>
        </label>
        <label>Cue
          <select id="cue">
            <option value="phase">Each phase</option><option value="count">Every count</option><option value="off">Off</option>
          </select>
        </label>
        <label id="swellwrap" class="swell">Swell <input type="range" id="swell" min="0" max="1" step="0.05" value="0.6" aria-label="Swell depth"></label>
      </div>
    </div>
  </main>

  <footer>
    <div>Cycles <b id="cycles">0</b> · Elapsed <b id="elapsed">0:00</b></div>
    <div>Pattern is the URL: <code id="hashview">#4-4-4-4</code> · nothing leaves this page</div>
  </footer>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const PHASES = ['Breathe in','Hold','Breathe out','Hold'];
  const SCALE = [1, 1, .55, .55];               // tide size at END of each phase
  const inputs = [$('d0'),$('d1'),$('d2'),$('d3')];
  const stage=$('stage'), tide=$('tide'), word=$('word'), count=$('count'), go=$('go');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- pattern state: URL hash is the source of truth ----
  const read = () => inputs.map(i => Math.max(0, Math.min(30, parseFloat(i.value) || 0)));
  const fmt = n => (Math.round(n*2)/2).toString();
  function render(){
    const d = read();
    $('code').innerHTML = d.map(fmt).join(' · ') + ' <span>sec</span>';
    const h = '#' + d.map(fmt).join('-');
    $('hashview').textContent = h;
    if (location.hash !== h) history.replaceState(null,'',h);
    document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.p === h.slice(1)));
    const tl = $('timeline'); tl.innerHTML='';
    d.forEach((s,i)=>{ if(s>0){ const b=document.createElement('i'); b.style.setProperty('--w', s); b.dataset.i=i; tl.appendChild(b);} });
    try{ localStorage.setItem('tide-breath', h); }catch(e){}
  }
  function load(str){
    const parts = (str||'').replace('#','').split('-').map(Number);
    if (parts.length===4 && parts.every(n => !isNaN(n))) inputs.forEach((i,k)=> i.value = fmt(parts[k]));
  }
  let saved=null; try{ saved = localStorage.getItem('tide-breath'); }catch(e){}
  load(location.hash || saved || '#4-4-4-4');
  render();
  inputs.forEach(i => i.addEventListener('change', () => { render(); if(running) restart(); }));
  $('presets').addEventListener('click', e => { const c=e.target.closest('.chip'); if(!c) return; load(c.dataset.p); render(); if(running) restart(); });
  addEventListener('hashchange', () => { load(location.hash); render(); if(running) restart(); });

  // ---- sound settings (remembered per device; the pattern stays in the URL) ----
  const sound=$('sound'), keySel=$('key'), cue=$('cue'), swell=$('swell');
  try{ const s=JSON.parse(localStorage.getItem('tide-breath-sound')||'{}');
    if(s.sound) sound.value=s.sound; if(s.key) keySel.value=s.key; if(s.cue) cue.value=s.cue; if(s.swell!=null) swell.value=s.swell; }catch(e){}
  function saveSound(){
    $('swellwrap').hidden = sound.value!=='wash';
    try{ localStorage.setItem('tide-breath-sound', JSON.stringify({sound:sound.value,key:keySel.value,cue:cue.value,swell:swell.value})); }catch(e){}
  }
  saveSound();

  const FREQ = {C:130.81,B:123.47,Bb:116.54,A:110,Ab:103.83,G:98,Gb:92.5,F:87.31,E:82.41,Eb:77.78,D:73.42,Db:69.3};
  let ctx=null, master=null, washIn=null, washLP=null, washAmp=null;
  // iOS only lets audio start inside a tap, so Begin builds/resumes the context up front.
  function audioUnlock(){
    if(sound.value==='off' && cue.value==='off') return;
    if(!ctx){
      ctx = new (window.AudioContext||window.webkitAudioContext)();
      master = ctx.createGain(); master.connect(ctx.destination);
      // wash chain: looping voices → lowpass (brightness) → amp (level) → out
      washIn = ctx.createGain(); washLP = ctx.createBiquadFilter(); washAmp = ctx.createGain();
      washLP.type='lowpass'; washLP.Q.value=.5;
      washIn.connect(washLP).connect(washAmp).connect(master);
      setTide(false);
    }
    try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}  // play through the silent switch
    if(ctx.state!=='running') ctx.resume();
  }

  // ---- wash: a 34s cut of the track per key, crossfaded into itself so it never seams ----
  const XF = 4;                                    // crossfade seconds between passes
  const raw={}, decoded={};
  const fetchWash = k => raw[k] ||= fetch(`audio/wash-${k}.m4a`).then(r => { if(!r.ok) throw r.status; return r.arrayBuffer(); })
                                                   .catch(e => { delete raw[k]; throw e; });
  const getWash = k => decoded[k] ||= fetchWash(k).then(b => ctx.decodeAudioData(b.slice(0)))
                                                   .catch(e => { delete decoded[k]; throw e; });
  const EQ_IN = Float32Array.from({length:32}, (_,i) => Math.sin(i/31*Math.PI/2));
  const EQ_OUT = EQ_IN.slice().reverse();
  let voices=[], washTimer=0, washGen=0;
  function voice(buf, t, fade){
    const src=ctx.createBufferSource(), g=ctx.createGain();
    src.buffer=buf; src.connect(g).connect(washIn);
    const end = t + buf.duration - XF;             // when the next pass takes over
    g.gain.setValueCurveAtTime(EQ_IN, t, fade);
    g.gain.setValueCurveAtTime(EQ_OUT, end, XF);
    src.start(t); src.stop(end + XF + .05);
    const v={src,g}; voices.push(v); src.onended = () => { voices = voices.filter(x => x!==v); };
    return end;
  }
  async function washStart(fade){
    const gen = ++washGen, k = keySel.value;
    let buf; try{ buf = await getWash(k); }catch(e){ return; }   // offline and never cached: stay quiet
    if(gen!==washGen || !running || sound.value!=='wash') return;
    const loop = t => { const next = voice(buf, t, t===t0 ? fade : XF);
      washTimer = setTimeout(() => { if(gen===washGen) loop(next); }, (next - ctx.currentTime - 1.5)*1000); };
    const t0 = ctx.currentTime + .05; loop(t0);
  }
  function washStop(fade){
    washGen++; clearTimeout(washTimer);
    const now=ctx ? ctx.currentTime : 0;
    voices.forEach(({src,g}) => { ramp(g.gain, 0, fade); try{ src.stop(now+fade+.05); }catch(e){} });
  }

  // ---- the swell: the wash rises (louder, brighter) with each inhale and ebbs with each exhale ----
  const ease = t => .5 - .5*Math.cos(Math.PI*t);
  function tideLevels(){
    const s=+swell.value;
    return { top:{gain:1, freq:6000}, low:{gain:1-.75*s, freq:6000*Math.pow(350/6000, s)} };
  }
  // Eased move from wherever the param is now; safe to call mid-ramp (pausing mid-inhale, etc).
  function ramp(param, to, dur, log){
    const now=ctx.currentTime, from=Math.max(param.value, log ? 1 : 0);
    if(param.cancelAndHoldAtTime) param.cancelAndHoldAtTime(now); else param.cancelScheduledValues(now);
    try{
      if(dur<.05) throw 0;
      const c = Float32Array.from({length:64}, (_,i) => { const e=ease(i/63);
        return log ? from*Math.pow(to/from, e) : from + (to-from)*e; });
      param.setValueCurveAtTime(c, now+.01, dur);
    }catch(e){ try{ param.setTargetAtTime(to, now, Math.max(dur,.05)/3); }catch(e2){ param.value=to; } }
  }
  function setTide(up, dur=0){
    if(!ctx) return;
    const L = tideLevels()[up ? 'top' : 'low'];
    ramp(washAmp.gain, L.gain, dur); ramp(washLP.frequency, L.freq, dur, true);
  }

  // ---- cues: soft tones in the key — octave to breathe in, fifth to hold, root to breathe out ----
  const cueRoot = () => { let f=FREQ[keySel.value]; while(f<300) f*=2; return f; };
  function tone(f, level, decay){
    if(!ctx) return;
    const t=ctx.currentTime, g=ctx.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(level, t+.012); g.gain.exponentialRampToValueAtTime(.0001, t+decay);
    g.connect(master);
    [[1,1],[2,.25]].forEach(([m,a]) => { const o=ctx.createOscillator(), og=ctx.createGain();
      o.frequency.value=f*m; og.gain.value=a; o.connect(og).connect(g); o.start(t); o.stop(t+decay+.05); });
  }
  function phaseCue(p){ if(cue.value==='off') return; const r=cueRoot(); tone([r*2, r*1.5, r, r*1.5][p], .09, 1.6); }
  function countCue(){ if(cue.value==='count') tone(cueRoot()*2, .03, .35); }

  // ---- hum: a soft synth drone on the exhale, in the chosen key (octave below middle C) ----
  let gain=null, oscs=[];
  function humStart(){
    if(sound.value!=='hum') return;
    audioUnlock();
    humStop(true);
    const f = FREQ[keySel.value];
    gain = ctx.createGain(); gain.gain.value=0; gain.connect(master);
    [[1,.5],[2,.18],[3,.06]].forEach(([m,a])=>{      // a few partials so it hums rather than beeps
      const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f*m;
      const g=ctx.createGain(); g.gain.value=a; o.connect(g).connect(gain); o.start(); oscs.push(o);
    });
    gain.gain.linearRampToValueAtTime(.25, ctx.currentTime+.6);
  }
  function humStop(now){
    if(!gain) return;
    const g=gain, os=oscs; gain=null; oscs=[];
    const t = ctx.currentTime + (now?0.05:0.8);
    g.gain.cancelScheduledValues(ctx.currentTime); g.gain.setValueAtTime(g.gain.value, ctx.currentTime);
    g.gain.linearRampToValueAtTime(0, t);
    os.forEach(o=>o.stop(t+.05));
  }

  // ---- the loop ----
  let running=false, phase=0, phaseStart=0, sessionStart=0, cycles=0, raf=0, durs=[], lastCount=0;
  function setPhase(p){
    phase=p; phaseStart=performance.now();
    word.textContent = PHASES[p];
    document.querySelectorAll('.timeline i').forEach(b => b.classList.toggle('on', +b.dataset.i===p));
    if(!reduced){ tide.style.transitionDuration = durs[p]+'s'; }
    tide.style.transform = `scale(${SCALE[p]})`;
    if(p===0) setTide(true, durs[0]); else if(p===2) setTide(false, durs[2]);
    phaseCue(p); lastCount=Math.ceil(durs[p]);
    if(p===2) humStart(); else humStop(false);
  }
  function nextPhase(){
    let p=phase;
    do { p=(p+1)%4; if(p===0) { cycles++; $('cycles').textContent=cycles; } } while(durs[p]===0 && p!==phase);
    setPhase(p);
  }
  function tick(){
    if(!running) return;
    const now=performance.now();
    const left = durs[phase] - (now-phaseStart)/1000;
    const c = Math.max(0, Math.ceil(left));
    if(c!==lastCount){ lastCount=c; if(c>0) countCue(); }
    count.textContent = c;
    const e=Math.floor((now-sessionStart)/1000); $('elapsed').textContent = Math.floor(e/60)+':'+String(e%60).padStart(2,'0');
    if(left<=0) nextPhase();
    raf=requestAnimationFrame(tick);
  }
  // ---- keep the screen awake while breathing (released on pause) ----
  let lock=null;
  async function wake(){ try{ if(running && 'wakeLock' in navigator && !lock){ lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => lock=null); } }catch(e){} }
  function sleep(){ if(lock){ lock.release().catch(()=>{}); lock=null; } }
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState!=='visible') return;
    wake(); if(running && ctx && ctx.state!=='running') ctx.resume();   // iOS suspends audio in the background
  });

  // keepWash: a pattern change mid-session restarts the breath but lets the wash keep flowing
  function start(keepWash){
    durs=read(); if(durs.every(d=>d===0)) return;
    audioUnlock();
    running=true; wake(); go.textContent='Pause'; go.dataset.running='true'; stage.classList.add('anim');
    sessionStart=performance.now(); cycles=0; $('cycles').textContent='0';
    if(!keepWash && sound.value==='wash'){ setTide(false); washStart(3); }
    let p=0; while(durs[p]===0) p++;
    setPhase(p); tick();
  }
  function stop(keepWash){
    running=false; cancelAnimationFrame(raf); humStop(false); sleep();
    if(!keepWash){ washStop(2.5); setTide(false, 2.5); }
    go.textContent='Begin'; go.dataset.running='false'; stage.classList.remove('anim');
    word.textContent='Ready'; count.textContent='·';
    tide.style.transitionDuration=''; tide.style.transform='scale(.55)';
    document.querySelectorAll('.timeline i').forEach(b=>b.classList.remove('on'));
  }
  function restart(){ stop(true); start(true); }
  go.addEventListener('click', () => running ? stop() : start());
  addEventListener('keydown', e => { if(e.code==='Space' && e.target.tagName!=='INPUT' && e.target.tagName!=='SELECT'){ e.preventDefault(); go.click(); } });

  sound.addEventListener('change', () => {
    saveSound();
    if(sound.value!=='hum') humStop(false);
    if(sound.value==='wash'){ fetchWash(keySel.value).catch(()=>{}); if(running){ audioUnlock(); washStart(3); } }
    else washStop(2);
  });
  keySel.addEventListener('change', () => {
    saveSound();
    if(sound.value==='wash'){ fetchWash(keySel.value).catch(()=>{}); if(running){ washStop(2.5); washStart(2.5); } }
    if(running && phase===2) humStart();
  });
  cue.addEventListener('change', saveSound);
  swell.addEventListener('change', saveSound);   // takes effect on the next breath
  if(sound.value==='wash') fetchWash(keySel.value).catch(()=>{});   // download early; decoding waits for Begin

  if('serviceWorker' in navigator && location.protocol!=='file:') navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
