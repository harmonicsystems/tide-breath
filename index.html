<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tide Breath</title>
<meta name="description" content="A quiet breath pacer. Box, 4·7·8, coherent, or your own pattern. Nothing leaves this page.">
<meta name="theme-color" content="#FBFBFC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tide Breath">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Tokens from the Harmonic Systems design-system playground
   (~/Code/harmonic-systems-design). Components read only these. */
:root{
  --font-heading:'Inter',system-ui,-apple-system,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --fs-sm:13px; --fs-base:16px; --fs-md:20px; --fs-lg:25px;
  --heading-tracking:-0.02em;

  --primary:#326AB2; --primary-strong:#214A80; --primary-soft:#EAF0F6; --on-primary:#FFFFFF;
  --accent:#1F8F4E; --accent-soft:#DEF9E7;
  --bg:#FBFBFC; --bg-raised:#F3F4F6; --surface:#FFFFFF;
  --text:#212426; --text-muted:#62676E; --border-color:#E2E3E4;

  --radius:8px; --radius-sm:5px; --radius-lg:14px; --border-w:1px;
  --sp-1:4px; --sp-2:8px; --sp-3:16px; --sp-4:24px; --sp-5:40px;
  --shadow:0 1px 3px rgba(0,0,0,.07), 0 3px 10px rgba(0,0,0,.05);
  --shadow-lg:0 4px 12px rgba(0,0,0,.08), 0 12px 32px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --primary:#6F9BD6; --primary-strong:#A9C4EA; --primary-soft:#1B2638; --on-primary:#0B1220;
    --accent:#5FD08F; --accent-soft:#16291F;
    --bg:#121417; --bg-raised:#181B1F; --surface:#1A1C20;
    --text:#E4E6EA; --text-muted:#9DA2AA; --border-color:#2C3036;
    --shadow:0 1px 3px rgba(0,0,0,.4), 0 3px 10px rgba(0,0,0,.3);
    --shadow-lg:0 4px 12px rgba(0,0,0,.45), 0 12px 32px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --primary:#6F9BD6; --primary-strong:#A9C4EA; --primary-soft:#1B2638; --on-primary:#0B1220;
  --accent:#5FD08F; --accent-soft:#16291F;
  --bg:#121417; --bg-raised:#181B1F; --surface:#1A1C20;
  --text:#E4E6EA; --text-muted:#9DA2AA; --border-color:#2C3036;
  --shadow:0 1px 3px rgba(0,0,0,.4), 0 3px 10px rgba(0,0,0,.3);
  --shadow-lg:0 4px 12px rgba(0,0,0,.45), 0 12px 32px rgba(0,0,0,.4);
}

/* Night: dim red on near-black, easy on dark-adapted eyes. Landscape: the layout itself turns 90°
   when the phone is held portrait (rotation lock or not); a physically landscape phone just gets the layout. */
:root[data-theme="night"]{
  --primary:#C9372B; --primary-strong:#E85A48; --primary-soft:#2A0806; --on-primary:#1A0300;
  --accent:#C9372B; --accent-soft:#2A0806;
  --bg:#0A0000; --bg-raised:#140303; --surface:#120202;
  --text:#D9452F; --text-muted:#9A3327; --border-color:#3A0E0A;
  --shadow:none; --shadow-lg:none;
}
:root[data-theme="night"] body{overflow:hidden}
:root[data-theme="night"] #app{position:fixed; inset:0; overflow:auto; -webkit-overflow-scrolling:touch}
@media (orientation: portrait){
  :root[data-theme="night"] #app{inset:auto; top:0; left:0; width:100vh; height:100vw; width:100dvh; height:100dvw;
    transform-origin:0 0; transform:rotate(90deg) translateY(-100%)}
}
:root[data-theme="night"] .wrap{max-width:none; grid-template-columns:auto 1fr; align-items:center; column-gap:var(--sp-4); padding-inline:var(--sp-4)}
:root[data-theme="night"] .stage{grid-row:1 / span 2; width:min(62vmin,300px); margin:0; align-self:start; position:sticky; top:var(--sp-3)}
:root[data-theme="night"] body[data-running="true"] .stage{align-self:center; position:relative}
:root[data-theme="night"] .guide,:root[data-theme="night"] .settings{grid-column:2}
:root[data-theme="night"] .guide{align-self:end}
:root[data-theme="night"] .settings{align-self:start}
:root[data-theme="night"] body[data-running="true"] .nav{display:none}
:root[data-theme="night"] body[data-running="true"] .guide{align-self:center}
:root[data-theme="night"] .tide{background:color-mix(in srgb, var(--primary) 22%, transparent)}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:var(--fs-base); line-height:1.5; -webkit-font-smoothing:antialiased}
h1,h2{font-family:var(--font-heading); font-weight:600; letter-spacing:var(--heading-tracking); line-height:1.15; margin:0}
button,input,select{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--primary); outline-offset:2px}

/* nav: logo left, pattern kicker right */
.nav{display:flex; align-items:center; gap:var(--sp-3); padding:var(--sp-3) max(var(--sp-4), env(safe-area-inset-right)) var(--sp-3) max(var(--sp-4), env(safe-area-inset-left));
  padding-top:max(var(--sp-3), env(safe-area-inset-top)); border-bottom:var(--border-w) solid var(--border-color)}
.logo{font-family:var(--font-heading); font-weight:700; font-size:var(--fs-md); letter-spacing:var(--heading-tracking); margin:0}
.logo em{color:var(--primary); font-style:normal}
.spacer{flex:1}
.kicker{font-family:var(--font-mono); font-size:var(--fs-sm); color:var(--primary-strong); background:var(--primary-soft);
  border:var(--border-w) solid color-mix(in srgb, var(--primary) 35%, transparent); padding:3px var(--sp-2); border-radius:var(--radius-sm); white-space:nowrap; font-variant-numeric:tabular-nums}

.wrap{max-width:560px; margin:0 auto; padding:var(--sp-4) max(var(--sp-3), env(safe-area-inset-right)) var(--sp-4) max(var(--sp-3), env(safe-area-inset-left)); display:grid; gap:var(--sp-3)}

/* the breathing circle */
.stage{position:relative; width:min(68vw,300px); aspect-ratio:1; justify-self:center; display:grid; place-items:center; margin-block:var(--sp-2);
  background:none; border:0; padding:0; cursor:pointer; -webkit-tap-highlight-color:transparent; border-radius:50%}
.stage:focus-visible{outline-offset:8px}
.ring{position:absolute; inset:0; border-radius:50%; border:var(--border-w) solid color-mix(in srgb, var(--primary) 30%, transparent)}
.tide{width:100%; height:100%; border-radius:50%; background:color-mix(in srgb, var(--primary) 14%, transparent); transform:scale(.55); transition:transform .3s linear}
.stage.anim .tide{transition-timing-function:cubic-bezier(.45,0,.55,1)}
.phase{position:absolute; inset:0; display:grid; place-items:center; text-align:center; pointer-events:none}
.phase .word,.phase .count{display:block}
.phase .word{font-weight:600; letter-spacing:.18em; text-transform:uppercase; font-size:var(--fs-sm); color:var(--primary-strong); padding-left:.18em}
.phase .count{font-weight:300; font-size:48px; line-height:1; margin-top:var(--sp-1); font-variant-numeric:tabular-nums; color:var(--text)}
.stage[data-running="false"] .count{display:none}

/* under the circle: one breath cycle as a single line (a dot travels it), and one quiet line of text */
.guide{display:grid; justify-items:center; text-align:center; gap:var(--sp-2); padding-inline:var(--sp-3)}
.meta{font-size:var(--fs-sm); color:var(--text-muted)}
.meta .title{font-weight:600; color:var(--text)}
.hint{font-size:12px; color:var(--text-muted); opacity:0; transition:opacity .4s}
body[data-running="true"] .hint{opacity:1}
.wave{width:100%; max-width:360px; height:44px; display:block}
.wave .base{fill:none; stroke:var(--border-color); stroke-width:2; stroke-linecap:round}
.wave .lit{fill:none; stroke:var(--primary); stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.wave .dot{fill:var(--primary); r:4}
.wave[data-idle="true"] .lit,.wave[data-idle="true"] .dot{visibility:hidden}

/* cards */
.card{background:var(--surface); border:var(--border-w) solid var(--border-color); border-radius:var(--radius-lg); padding:var(--sp-3) var(--sp-4) var(--sp-4); box-shadow:var(--shadow); display:grid; gap:var(--sp-3)}
.card h2{font-size:var(--fs-md)}

/* buttons */
.btn-row{display:grid; grid-template-columns:repeat(auto-fit, minmax(110px, 1fr)); gap:var(--sp-2)}
.btn{font-size:var(--fs-sm); font-weight:600; padding:10px var(--sp-3); border-radius:var(--radius); border:var(--border-w) solid var(--border-color); background:transparent; cursor:pointer}
.btn:hover{background:var(--bg-raised)}
.btn[aria-pressed="true"]{background:var(--primary); border-color:var(--primary); color:var(--on-primary); box-shadow:var(--shadow)}

/* fields */
.fields{display:grid; gap:var(--sp-2)}
.fields.four{grid-template-columns:repeat(4,1fr)}
.fields.three{grid-template-columns:repeat(3,1fr)}
.field label{display:block; font-size:var(--fs-sm); font-weight:600; margin-bottom:var(--sp-1)}
.field input,.field select{width:100%; font-size:var(--fs-base); padding:9px var(--sp-2); border-radius:var(--radius); border:var(--border-w) solid var(--border-color); background:var(--bg); color:var(--text)}
.field input{font-family:var(--font-mono); text-align:center; font-variant-numeric:tabular-nums; -moz-appearance:textfield}
.field input::-webkit-outer-spin-button,.field input::-webkit-inner-spin-button{-webkit-appearance:none}
.field input:focus,.field select:focus{outline:2px solid var(--primary); outline-offset:1px; border-color:var(--primary)}
.field select{-webkit-appearance:none; appearance:none; padding-right:26px;
  background-repeat:no-repeat; background-size:5px 5px;
  background-image:linear-gradient(45deg, transparent 50%, var(--text-muted) 50%), linear-gradient(135deg, var(--text-muted) 50%, transparent 50%);
  background-position:calc(100% - 15px) 55%, calc(100% - 10px) 55%}
.swell{display:flex; align-items:center; gap:var(--sp-3); font-size:var(--fs-sm); font-weight:600}
.swell input{flex:1; accent-color:var(--primary); margin:0}
.swell[hidden]{display:none}

/* settings fold away while breathing so only the circle is left */
.settings{display:grid; grid-template-rows:1fr; opacity:1; transition:grid-template-rows .5s ease, opacity .3s ease}
.settings > div{min-height:0; overflow:hidden; display:grid; gap:var(--sp-3)}
body[data-running="true"] .settings{grid-template-rows:0fr; opacity:0}

/* footer */
footer{color:var(--text-muted); font-size:var(--fs-sm); display:grid; gap:var(--sp-2); padding-top:var(--sp-3); border-top:var(--border-w) solid var(--border-color); margin-top:var(--sp-2)}
footer b{font-family:var(--font-mono); font-weight:500; color:var(--text)}
footer code{font-family:var(--font-mono); color:var(--primary-strong)}
footer .row{display:flex; flex-wrap:wrap; gap:var(--sp-2); align-items:center; justify-content:space-between}
.badge{display:inline-block; font-size:12px; font-weight:600; padding:2px var(--sp-2); border-radius:var(--radius-sm);
  background:var(--accent-soft); color:var(--accent); border:var(--border-w) solid color-mix(in srgb, var(--accent) 35%, transparent)}
.badge[hidden]{display:none}

@media (prefers-reduced-motion: reduce){ .tide,.settings,.hint{transition:none !important} }
@media (max-width:380px){ .card,.player{padding-inline:var(--sp-3)} .btn{padding-inline:12px} }
</style>

<div id="app">
<header class="nav">
  <h1 class="logo">Tide<em>Breath</em></h1>
  <div class="spacer"></div>
  <span class="kicker" id="code" aria-live="polite">4 · 4 · 4 · 4 s</span>
  <button class="btn" id="night" aria-pressed="false" title="Red landscape mode, easy on the eyes">Night</button>
</header>

<main class="wrap">
  <button class="stage" id="go" data-running="false" aria-label="Begin">
    <span class="ring"></span>
    <span class="tide" id="tide"></span>
    <span class="phase">
      <span>
        <span class="word" id="word">Tap to begin</span>
        <span class="count" id="count">·</span>
      </span>
    </span>
  </button>

  <div class="guide">
    <svg class="wave" id="wave" viewBox="0 0 400 48" preserveAspectRatio="none" aria-hidden="true" data-idle="true">
      <path class="base" id="wbase" d=""/><path class="lit" id="wlit" d=""/><circle class="dot" id="wdot" cx="0" cy="0"/>
    </svg>
    <div class="meta"><span class="title" id="ptitle">Box</span> · <span id="partist">Wash in C</span></div>
    <div class="hint" aria-hidden="true">Tap the circle to pause</div>
  </div>

  <div class="settings" id="settings"><div>

  <section class="card" aria-labelledby="h-pattern">
    <h2 id="h-pattern">Pattern</h2>
    <div class="btn-row" id="presets" role="group" aria-label="Patterns">
      <button class="btn chip" data-p="4-4-4-4">Box</button>
      <button class="btn chip" data-p="4-7-8-0">4·7·8</button>
      <button class="btn chip" data-p="5.5-0-5.5-0">Coherent</button>
      <button class="btn chip" data-p="4-0-8-0">Long exhale</button>
    </div>
    <div class="fields four">
      <div class="field"><label for="d0">In</label><input id="d0" type="number" inputmode="decimal" min="0" max="30" step="0.5" value="4"></div>
      <div class="field"><label for="d1">Hold</label><input id="d1" type="number" inputmode="decimal" min="0" max="30" step="0.5" value="4"></div>
      <div class="field"><label for="d2">Out</label><input id="d2" type="number" inputmode="decimal" min="0" max="30" step="0.5" value="4"></div>
      <div class="field"><label for="d3">Hold</label><input id="d3" type="number" inputmode="decimal" min="0" max="30" step="0.5" value="4"></div>
    </div>
  </section>

  <section class="card" aria-labelledby="h-sound">
    <h2 id="h-sound">Sound</h2>
    <div class="fields three">
      <div class="field"><label for="sound">Drone</label>
        <select id="sound"><option value="wash">Wash</option><option value="hum">Hum</option><option value="off">None</option></select></div>
      <div class="field"><label for="key">Key</label>
        <select id="key">
          <option value="C">C</option><option value="B">B</option><option value="Bb">B♭</option><option value="A">A</option>
          <option value="Ab">A♭</option><option value="G">G</option><option value="Gb">G♭</option><option value="F">F</option>
          <option value="E">E</option><option value="Eb">E♭</option><option value="D">D</option><option value="Db">D♭</option>
        </select></div>
      <div class="field"><label for="cue">Cue</label>
        <select id="cue"><option value="phase">Phases</option><option value="count">Counts</option><option value="off">Off</option></select></div>
    </div>
    <label class="swell" id="swellwrap">Swell <input type="range" id="swell" min="0" max="1" step="0.05" value="0.6"></label>
  </section>

  <footer>
    <div class="row"><span>Cycles <b id="cycles">0</b> · Elapsed <b id="elapsed">0:00</b></span><span class="badge" id="offline" hidden>Works offline</span></div>
    <div>Pattern is the URL: <code id="hashview">#4-4-4-4</code> · nothing leaves this page</div>
    <div>Harmonic Systems</div>
  </footer>
  </div></div>
</main>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const PHASES = ['Breathe in','Hold','Breathe out','Hold'];
  const SCALE = [1, 1, .55, .55];               // tide size at END of each phase
  const inputs = [$('d0'),$('d1'),$('d2'),$('d3')];
  const go=$('go'), stage=go, tide=$('tide'), word=$('word'), count=$('count');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- pattern state: URL hash is the source of truth ----
  const read = () => inputs.map(i => Math.max(0, Math.min(30, parseFloat(i.value) || 0)));
  const fmt = n => (Math.round(n*2)/2).toString();
  function render(){
    const d = read();
    $('code').textContent = d.map(fmt).join(' · ') + ' s';
    const h = '#' + d.map(fmt).join('-');
    $('hashview').textContent = h;
    if (location.hash !== h) history.replaceState(null,'',h);
    let name='Custom';
    document.querySelectorAll('.chip').forEach(c => { const on = c.dataset.p === h.slice(1); c.setAttribute('aria-pressed', on); if(on) name=c.textContent; });
    $('ptitle').textContent = name;
    drawWave(d);
    try{ localStorage.setItem('tide-breath', h); }catch(e){}
  }
  // The player's line is one breath cycle: it rises through the inhale, sits high on the hold,
  // falls through the exhale. A dot travels it as the cycle is breathed.
  const W=400, H=48, PAD=6, wave=$('wave'), wbase=$('wbase'), wlit=$('wlit'), wdot=$('wdot');
  let waveTotal = 0, waveLen = 0;
  function drawWave(d){
    waveTotal = d.reduce((a,b)=>a+b, 0); if(!waveTotal) return;
    const e = t => .5 - .5*Math.cos(Math.PI*t), pts=[];
    for(let i=0;i<=120;i++){
      let t=i/120*waveTotal, p=0; while(p<3 && t>d[p]){ t-=d[p]; p++; }
      const f = d[p] ? Math.min(1, t/d[p]) : 0;
      const h = [e(f), 1, 1-e(f), 0][p];
      pts.push((i/120*(W-2*PAD)+PAD).toFixed(1) + ',' + (H-PAD - h*(H-2*PAD)).toFixed(1));
    }
    const dpath = 'M' + pts.join(' L');
    wbase.setAttribute('d', dpath); wlit.setAttribute('d', dpath);
    waveLen = wlit.getTotalLength();
    wlit.style.strokeDasharray = waveLen; lightWave(-1);
  }
  function lightWave(pos){        // pos: seconds into the current cycle, or -1 to clear
    if(pos<0 || !waveTotal){ wave.dataset.idle='true'; return; }
    wave.dataset.idle='false';
    const len = Math.min(1, pos/waveTotal) * waveLen;
    wlit.style.strokeDashoffset = waveLen - len;
    const pt = wlit.getPointAtLength(len); wdot.setAttribute('cx', pt.x); wdot.setAttribute('cy', pt.y);
  }
  function load(str){
    const parts = (str||'').replace('#','').split('-').map(Number);
    if (parts.length===4 && parts.every(n => !isNaN(n))) inputs.forEach((i,k)=> i.value = fmt(parts[k]));
  }
  let saved=null; try{ saved = localStorage.getItem('tide-breath'); }catch(e){}
  load(location.hash || saved || '#4-4-4-4');
  render();
  inputs.forEach(i => i.addEventListener('change', () => { render(); if(running) restart(); }));
  $('presets').addEventListener('click', e => { const c=e.target.closest('.chip'); if(!c) return; load(c.dataset.p); render(); if(running) restart(); });
  addEventListener('hashchange', () => { load(location.hash); render(); if(running) restart(); });

  // ---- sound settings (remembered per device; the pattern stays in the URL) ----
  const sound=$('sound'), keySel=$('key'), cue=$('cue'), swell=$('swell');
  try{ const s=JSON.parse(localStorage.getItem('tide-breath-sound')||'{}');
    if(s.sound) sound.value=s.sound; if(s.key) keySel.value=s.key; if(s.cue) cue.value=s.cue; if(s.swell!=null) swell.value=s.swell; }catch(e){}
  function saveSound(){
    $('swellwrap').hidden = sound.value!=='wash';
    const k = keySel.options[keySel.selectedIndex].text;
    $('partist').textContent = sound.value==='wash' ? `Wash in ${k}` : sound.value==='hum' ? `Hum on exhale in ${k}` : 'Silent';
    try{ localStorage.setItem('tide-breath-sound', JSON.stringify({sound:sound.value,key:keySel.value,cue:cue.value,swell:swell.value})); }catch(e){}
  }
  saveSound();

  const FREQ = {C:130.81,B:123.47,Bb:116.54,A:110,Ab:103.83,G:98,Gb:92.5,F:87.31,E:82.41,Eb:77.78,D:73.42,Db:69.3};
  let ctx=null, master=null, washIn=null, washLP=null, washAmp=null;
  // iOS only lets audio start inside a tap, so Begin builds/resumes the context up front.
  function audioUnlock(){
    if(sound.value==='off' && cue.value==='off') return;
    if(!ctx){
      ctx = new (window.AudioContext||window.webkitAudioContext)();
      master = ctx.createGain(); master.connect(ctx.destination);
      // wash chain: looping voices → lowpass (brightness) → amp (level) → out
      washIn = ctx.createGain(); washLP = ctx.createBiquadFilter(); washAmp = ctx.createGain();
      washLP.type='lowpass'; washLP.Q.value=.5;
      washIn.connect(washLP).connect(washAmp).connect(master);
      setTide(false);
    }
    try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}  // play through the silent switch
    if(ctx.state!=='running') ctx.resume();
  }

  // ---- wash: a 34s cut of the track per key, crossfaded into itself so it never seams ----
  const XF = 4;                                    // crossfade seconds between passes
  const raw={}, decoded={};
  const fetchWash = k => raw[k] ||= fetch(`audio/wash-${k}.m4a`).then(r => { if(!r.ok) throw r.status; return r.arrayBuffer(); })
                                                   .catch(e => { delete raw[k]; throw e; });
  const getWash = k => decoded[k] ||= fetchWash(k).then(b => ctx.decodeAudioData(b.slice(0)))
                                                   .catch(e => { delete decoded[k]; throw e; });
  const EQ_IN = Float32Array.from({length:32}, (_,i) => Math.sin(i/31*Math.PI/2));
  const EQ_OUT = EQ_IN.slice().reverse();
  let voices=[], washTimer=0, washGen=0;
  function voice(buf, t, fade){
    const src=ctx.createBufferSource(), g=ctx.createGain();
    src.buffer=buf; src.connect(g).connect(washIn);
    const end = t + buf.duration - XF;             // when the next pass takes over
    g.gain.setValueCurveAtTime(EQ_IN, t, fade);
    g.gain.setValueCurveAtTime(EQ_OUT, end, XF);
    src.start(t); src.stop(end + XF + .05);
    const v={src,g}; voices.push(v); src.onended = () => { voices = voices.filter(x => x!==v); };
    return end;
  }
  async function washStart(fade){
    const gen = ++washGen, k = keySel.value;
    let buf; try{ buf = await getWash(k); }catch(e){ return; }   // offline and never cached: stay quiet
    if(gen!==washGen || !running || sound.value!=='wash') return;
    const loop = t => { const next = voice(buf, t, t===t0 ? fade : XF);
      washTimer = setTimeout(() => { if(gen===washGen) loop(next); }, (next - ctx.currentTime - 1.5)*1000); };
    const t0 = ctx.currentTime + .05; loop(t0);
  }
  function washStop(fade){
    washGen++; clearTimeout(washTimer);
    const now=ctx ? ctx.currentTime : 0;
    voices.forEach(({src,g}) => { ramp(g.gain, 0, fade); try{ src.stop(now+fade+.05); }catch(e){} });
  }

  // ---- the swell: the wash rises (louder, brighter) with each inhale and ebbs with each exhale ----
  const ease = t => .5 - .5*Math.cos(Math.PI*t);
  function tideLevels(){
    const s=+swell.value;
    return { top:{gain:1, freq:6000}, low:{gain:1-.75*s, freq:6000*Math.pow(350/6000, s)} };
  }
  // Eased move from wherever the param is now; safe to call mid-ramp (pausing mid-inhale, etc).
  function ramp(param, to, dur, log){
    const now=ctx.currentTime, from=Math.max(param.value, log ? 1 : 0);
    if(param.cancelAndHoldAtTime) param.cancelAndHoldAtTime(now); else param.cancelScheduledValues(now);
    try{
      if(dur<.05) throw 0;
      const c = Float32Array.from({length:64}, (_,i) => { const e=ease(i/63);
        return log ? from*Math.pow(to/from, e) : from + (to-from)*e; });
      param.setValueCurveAtTime(c, now+.01, dur);
    }catch(e){ try{ param.setTargetAtTime(to, now, Math.max(dur,.05)/3); }catch(e2){ param.value=to; } }
  }
  function setTide(up, dur=0){
    if(!ctx) return;
    const L = tideLevels()[up ? 'top' : 'low'];
    ramp(washAmp.gain, L.gain, dur); ramp(washLP.frequency, L.freq, dur, true);
  }

  // ---- cues: soft tones in the key — octave to breathe in, fifth to hold, root to breathe out ----
  const cueRoot = () => { let f=FREQ[keySel.value]; while(f<300) f*=2; return f; };
  function tone(f, level, decay){
    if(!ctx) return;
    const t=ctx.currentTime, g=ctx.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(level, t+.012); g.gain.exponentialRampToValueAtTime(.0001, t+decay);
    g.connect(master);
    [[1,1],[2,.25]].forEach(([m,a]) => { const o=ctx.createOscillator(), og=ctx.createGain();
      o.frequency.value=f*m; og.gain.value=a; o.connect(og).connect(g); o.start(t); o.stop(t+decay+.05); });
  }
  function phaseCue(p){ if(cue.value==='off') return; const r=cueRoot(); tone([r*2, r*1.5, r, r*1.5][p], .09, 1.6); }
  function countCue(){ if(cue.value==='count') tone(cueRoot()*2, .03, .35); }

  // ---- hum: a soft synth drone on the exhale, in the chosen key (octave below middle C) ----
  let gain=null, oscs=[];
  function humStart(){
    if(sound.value!=='hum') return;
    audioUnlock();
    humStop(true);
    const f = FREQ[keySel.value];
    gain = ctx.createGain(); gain.gain.value=0; gain.connect(master);
    [[1,.5],[2,.18],[3,.06]].forEach(([m,a])=>{      // a few partials so it hums rather than beeps
      const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f*m;
      const g=ctx.createGain(); g.gain.value=a; o.connect(g).connect(gain); o.start(); oscs.push(o);
    });
    gain.gain.linearRampToValueAtTime(.25, ctx.currentTime+.6);
  }
  function humStop(now){
    if(!gain) return;
    const g=gain, os=oscs; gain=null; oscs=[];
    const t = ctx.currentTime + (now?0.05:0.8);
    g.gain.cancelScheduledValues(ctx.currentTime); g.gain.setValueAtTime(g.gain.value, ctx.currentTime);
    g.gain.linearRampToValueAtTime(0, t);
    os.forEach(o=>o.stop(t+.05));
  }

  // ---- the loop ----
  let running=false, phase=0, phaseStart=0, sessionStart=0, cycles=0, raf=0, durs=[], lastCount=0;
  function setPhase(p){
    phase=p; phaseStart=performance.now();
    word.textContent = PHASES[p];
    if(!reduced){ tide.style.transitionDuration = durs[p]+'s'; }
    tide.style.transform = `scale(${SCALE[p]})`;
    if(p===0) setTide(true, durs[0]); else if(p===2) setTide(false, durs[2]);
    phaseCue(p); lastCount=Math.ceil(durs[p]);
    if(p===2) humStart(); else humStop(false);
  }
  function nextPhase(){
    let p=phase;
    do { p=(p+1)%4; if(p===0) { cycles++; $('cycles').textContent=cycles; } } while(durs[p]===0 && p!==phase);
    setPhase(p);
  }
  function tick(){
    if(!running) return;
    const now=performance.now();
    const left = durs[phase] - (now-phaseStart)/1000;
    const c = Math.max(0, Math.ceil(left));
    if(c!==lastCount){ lastCount=c; if(c>0) countCue(); }
    count.textContent = c;
    const e=Math.floor((now-sessionStart)/1000); $('elapsed').textContent = Math.floor(e/60)+':'+String(e%60).padStart(2,'0');
    let pos = (now-phaseStart)/1000; for(let q=0;q<phase;q++) pos += durs[q];
    lightWave(pos);
    if(left<=0) nextPhase();
    raf=requestAnimationFrame(tick);
  }
  // ---- keep the screen awake while breathing (released on pause) ----
  let lock=null;
  async function wake(){ try{ if(running && 'wakeLock' in navigator && !lock){ lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => lock=null); } }catch(e){} }
  function sleep(){ if(lock){ lock.release().catch(()=>{}); lock=null; } }
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState!=='visible') return;
    wake(); if(running && ctx && ctx.state!=='running') ctx.resume();   // iOS suspends audio in the background
  });

  // keepWash: a pattern change mid-session restarts the breath but lets the wash keep flowing
  function start(keepWash){
    durs=read(); if(durs.every(d=>d===0)) return;
    audioUnlock();
    running=true; wake(); go.setAttribute('aria-label','Pause'); go.dataset.running='true';
    document.body.dataset.running='true'; $('settings').inert=true; [window, $('app')].forEach(el => el.scrollTo({top:0, behavior: reduced ? 'auto' : 'smooth'})); stage.classList.add('anim');
    sessionStart=performance.now(); cycles=0; $('cycles').textContent='0';
    if(!keepWash && sound.value==='wash'){ setTide(false); washStart(3); }
    let p=0; while(durs[p]===0) p++;
    setPhase(p); tick();
  }
  function stop(keepWash){
    running=false; cancelAnimationFrame(raf); humStop(false); sleep();
    if(!keepWash){ washStop(2.5); setTide(false, 2.5); }
    go.setAttribute('aria-label','Begin'); go.dataset.running='false';
    document.body.dataset.running='false'; $('settings').inert=false; stage.classList.remove('anim');
    word.textContent='Tap to begin'; count.textContent='·';
    tide.style.transitionDuration=''; tide.style.transform='scale(.55)';
    lightWave(-1);
  }
  function restart(){ stop(true); start(true); }
  go.addEventListener('click', () => running ? stop() : start());
  addEventListener('keydown', e => { if(e.code==='Space' && e.target.tagName!=='INPUT' && e.target.tagName!=='SELECT'){ e.preventDefault(); go.click(); } });

  sound.addEventListener('change', () => {
    saveSound();
    if(sound.value!=='hum') humStop(false);
    if(sound.value==='wash'){ fetchWash(keySel.value).catch(()=>{}); if(running){ audioUnlock(); washStart(3); } }
    else washStop(2);
  });
  keySel.addEventListener('change', () => {
    saveSound();
    if(sound.value==='wash'){ fetchWash(keySel.value).catch(()=>{}); if(running){ washStop(2.5); washStart(2.5); } }
    if(running && phase===2) humStart();
  });
  cue.addEventListener('change', saveSound);
  swell.addEventListener('change', saveSound);   // takes effect on the next breath
  if(sound.value==='wash') fetchWash(keySel.value).catch(()=>{});   // download early; decoding waits for Begin

  // ---- night mode: red theme + landscape, remembered per device ----
  const night=$('night'), metas=[...document.querySelectorAll('meta[name="theme-color"]')];
  metas.forEach(m => m.dataset.day = m.content);
  function setNight(on){
    if(on) document.documentElement.dataset.theme='night'; else delete document.documentElement.dataset.theme;
    night.textContent = on ? 'Day' : 'Night'; night.setAttribute('aria-pressed', on);
    metas.forEach(m => m.content = on ? '#0A0000' : m.dataset.day);
    try{ localStorage.setItem('tide-breath-night', on ? '1' : ''); }catch(e){}
  }
  night.addEventListener('click', () => setNight(!document.documentElement.dataset.theme));
  try{ if(localStorage.getItem('tide-breath-night')) setNight(true); }catch(e){}

  if('serviceWorker' in navigator && location.protocol!=='file:'){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
    navigator.serviceWorker.ready.then(() => { $('offline').hidden = false; });
  }
})();
</script>
